version: "3.8"

services:
  api:
    build: .
    container_name: py-store-api
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      # NÃO monta código em prod — apenas em dev
      # - ./app:/app/app
    env_file:
      - .env  # .env NÃO é commitado — seguro
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MongoDB local para desenvolvimento
  mongodb:
    image: mongo:7
    container_name: py-store-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
