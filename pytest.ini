[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --strict-config
    --cov=app
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=0
markers =
    unit: Testes unitarios
    integration: Testes de integracao
    security: Testes de seguranca
    slow: Testes lentos (requerem DB externo)
